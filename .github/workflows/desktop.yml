name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "web/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: okplayer-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
