name: vita

on:
  push:
    branches: [main]
    paths: ["vita/**", ".github/workflows/vita.yml"]
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch decoders
        run: vita/tools/fetch_decoders.sh
      - name: Build in the VitaSDK image
        run: |
          docker run --rm -v "$PWD/vita:/work" -w /work vitasdk/vitasdk:latest /bin/sh -c \
            'cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4'
      - uses: actions/upload-artifact@v4
        with:
          name: okplayer-vita
          path: vita/build/okplayer.vpk
