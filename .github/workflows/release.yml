name: release

# Run from the Actions tab (or the API) with a version like 0.2.0: builds the APK,
# tags the current commit v<version> and publishes a release with the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "okplayer-v${{ inputs.version }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: okplayer ${{ inputs.version }}
          generate_release_notes: true
          files: okplayer-v${{ inputs.version }}.apk
