name: release

# Run from the Actions tab (or the API) with a version like 0.2.0: builds the APK,
# tags the current commit v<version> and publishes a release with the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "okplayer-v${{ inputs.version }}.apk"
      - name: Release notes from the changelog
        run: |
          awk -v v="## ${{ inputs.version }}" '$0==v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\nInstall the APK below; it updates earlier versions in place.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: okplayer ${{ inputs.version }}
          body_path: notes.md
          files: okplayer-v${{ inputs.version }}.apk

  vita:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch decoders
        run: vita/tools/fetch_decoders.sh
      - name: Build in the VitaSDK image
        run: |
          docker run --rm -v "$PWD/vita:/work" -w /work vitasdk/vitasdk:latest /bin/sh -c \
            'cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4'
          cp vita/build/okplayer.vpk "okplayer-vita-v${{ inputs.version }}.vpk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: okplayer-vita-v${{ inputs.version }}.vpk

  desktop:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
