<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4a73">
<title>okplayer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{
  color-scheme:light;
  --ui:"Segoe UI","Segoe UI Variable",Tahoma,"Noto Sans",Roboto,Arial,sans-serif;
  --lcdfont:"Share Tech Mono",ui-monospace,Consolas,monospace;
  /* aero frame */
  --frame:rgba(170,205,235,.62); --frameEdge:rgba(255,255,255,.75); --frameLine:rgba(18,38,58,.62);
  /* library pane, taken from explorer and wmp 12 */
  --paper:#ffffff; --ink:#1e1e1e; --sub:#6d6d6d; --head:#1e395b; --rule:#e2e7ee;
  --hover:#e5f3fb; --hoverEdge:#70c0e7; --sel:#cce8ff; --selEdge:#99d1ff;
  --cmd1:#fafcfe; --cmd2:#e3ecf5; --cmdEdge:#a0afc3;
  /* now playing */
  --black:#050607; --lcdBg:#07181c; --lcdOn:#8ff0ff; --lcdOff:rgba(143,240,255,.13); --star:#f5b301;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--ui);color:var(--ink);display:flex;justify-content:center;overflow:hidden;
  background:#0f4d7c radial-gradient(ellipse 120% 70% at 30% 105%,#49b4ea 0,rgba(73,180,234,0) 60%) fixed,
             linear-gradient(165deg,#2f8fce,#135a91 48%,#0a2f52) fixed;}
button{font:inherit;color:inherit}
svg{display:block}

/* ---- window frame ---- */
.win{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 5px 0;background:var(--frame);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:inset 0 0 0 1px var(--frameEdge),0 0 0 1px var(--frameLine),0 20px 60px rgba(0,12,30,.5)}
@media (min-width:640px){.win{height:calc(100% - 56px);margin-top:28px;border-radius:7px;padding-top:0}}
.title{flex:none;height:30px;display:flex;align-items:center;gap:7px;padding-left:5px}
.title .ico{width:16px;height:16px;flex:none;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0,#ffd27a 22%,#f08a1c 55%,#b3470a 100%);box-shadow:0 0 0 1px rgba(120,50,0,.35)}
.title span{flex:1;min-width:0;font-size:12px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 8px #fff,0 0 8px #fff,0 0 3px #fff}
.caption{display:flex;align-self:flex-start}
.caption i{width:26px;height:18px;border:1px solid rgba(30,50,70,.6);border-top:0;background:linear-gradient(#eef4fa,#c3d6e8 48%,#a9c1d8 52%,#d4e3f1)}
.caption i:first-child{border-radius:0 0 0 4px}
.caption i.x{width:44px;border-radius:0 0 4px 0;background:linear-gradient(#e9a597,#d4583f 48%,#c23b22 52%,#e48a6b)}

/* ---- toolbar (glass, part of the frame) ---- */
.toolbar{flex:none;display:flex;align-items:center;gap:6px;padding:2px 2px 6px}
.navbtn{width:28px;height:28px;border-radius:50%;border:1px solid #1d4f7c;padding:0;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 28%,#cbe9ff 0,#5aaee8 38%,#1f69ad 62%,#16508a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.25)}
.navbtn:disabled{cursor:default;filter:saturate(0) brightness(1.15);opacity:.55}
.navbtn:not(:disabled):hover{filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 8px rgba(120,210,255,.9)}
.crumb{flex:1;min-width:0;height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #8ea4bd;border-radius:2px;
  background:linear-gradient(#fff,#f3f7fb);box-shadow:inset 0 1px 1px rgba(0,0,0,.08);white-space:nowrap;overflow:hidden;font-size:12px;color:#333}
.crumb .sep{color:#8a9aac;font-size:10px}
.crumb button{background:none;border:0;padding:0 2px;cursor:pointer;border-radius:2px}
.crumb button:hover{background:var(--hover);box-shadow:0 0 0 1px var(--hoverEdge)}
.crumb b{font-weight:400;overflow:hidden;text-overflow:ellipsis}

/* ---- content pane ---- */
.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--frameLine);border-bottom:0;background:var(--paper);-webkit-overflow-scrolling:touch}
.pane.dark{background:var(--black)}

/* command bar (library only) */
.cmdbar{position:sticky;top:0;z-index:2;display:flex;gap:2px;align-items:center;height:32px;padding:0 6px;border-bottom:1px solid var(--cmdEdge);
  background:linear-gradient(var(--cmd1),var(--cmd2))}
.cmd{height:24px;padding:0 9px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;color:#1e1e1e;font-size:12px;display:flex;align-items:center;gap:5px}
.cmd:hover{border-color:#a8c8e4;background:linear-gradient(#fbfdff,#dbeaf8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.cmd .count{margin-left:auto}
.cmdbar .count{margin-left:auto;color:var(--sub);font-size:12px;padding-right:4px}

.lib{padding-bottom:16px}
.group{display:flex;align-items:center;gap:8px;margin:14px 12px 8px;color:var(--head);font-size:13px}
.group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#c5d3e3,rgba(197,211,227,0))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:4px;padding:0 8px}
.tile{display:flex;flex-direction:column;gap:5px;padding:7px;border:1px solid transparent;border-radius:3px;background:none;text-align:left;cursor:pointer;min-width:0}
.tile:hover{background:var(--hover);border-color:var(--hoverEdge)}
.tile:focus-visible{outline:none;background:var(--sel);border-color:var(--selEdge)}
.cover{width:100%;aspect-ratio:1;background:#d7dde5 center/cover no-repeat;box-shadow:0 1px 3px rgba(0,0,0,.35);position:relative}
.cover.gen{display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:28px;font-weight:300}
.tile b{font-weight:400;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{color:var(--sub);font-size:11.5px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{margin:16px 12px;padding:10px 12px;border:1px solid #e3cf7a;background:#fffbe6;color:#5a4a0c;font-size:12px}

.ahead{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:14px 12px 6px;align-items:end}
.ahead .cover{width:112px}
.ahead h2{margin:0;font-weight:400;font-size:18px;color:var(--head);line-height:1.2}
.ahead p{margin:3px 0 0;color:var(--sub);font-size:12px}
.ahead .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{height:24px;padding:0 12px;border:1px solid #707070;border-radius:3px;cursor:pointer;font-size:12px;color:#000;
  background:linear-gradient(#f2f2f2,#ebebeb 49%,#dddddd 51%,#cfcfcf);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.btn:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd,#d9f0fc 49%,#bee6fd 51%,#a7d9f5)}
.btn.warn:hover{border-color:#b33;background:linear-gradient(#fdeaea,#fcd9d9 49%,#fdbebe 51%,#f5a7a7)}
.cols{display:grid;grid-template-columns:30px minmax(0,1fr) 70px 42px;gap:8px;padding:0 12px;height:24px;align-items:center;margin-top:8px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);color:#4c607a;font-size:11.5px;background:linear-gradient(#fff,#f5f8fb)}
.trk{display:grid;grid-template-columns:30px minmax(0,1fr) 70px 42px;gap:8px;padding:0 11px;height:30px;align-items:center;width:100%;
  border:1px solid transparent;background:none;text-align:left;cursor:pointer;font-size:12.5px}
.trk:hover{background:var(--hover);border-color:var(--hoverEdge)}
.trk.cur{background:var(--sel);border-color:var(--selEdge)}
.trk .n,.trk .d{color:var(--sub);font-variant-numeric:tabular-nums}
.trk .d{text-align:right}
.trk .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:1px;color:#c9ced6}
.stars .on{color:var(--star)}
.stars svg{width:12px;height:12px}

/* ---- now playing: the deck ---- */
.np{min-height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 18px 16px;color:#dfe7ee;background:var(--black)}
.np canvas{position:absolute;inset:0;width:100%;height:100%}
.np > :not(canvas){position:relative}
.tabs{align-self:stretch;display:flex;gap:2px;margin:0 -10px}
.tabs button{background:none;border:1px solid transparent;border-radius:3px;color:#aeb6bf;font-size:12.5px;padding:4px 10px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:#fff;border-color:rgba(255,255,255,.25);background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.06))}
.stage{flex:1;width:100%;min-height:260px;display:grid;place-items:center}
.lyrics{align-self:stretch;height:100%;max-height:52vh;overflow-y:auto;text-align:center;padding:80px 6px;scroll-behavior:smooth;scrollbar-width:none;
  -webkit-mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lyrics p{margin:0;padding:5px 0;font-size:16px;line-height:1.45;color:#5b6873;transition:color .3s,font-size .3s}
.lyrics.plain p{color:#dce6ee}
.lyrics p.on{color:var(--lcdOn);font-size:19px;text-shadow:0 0 12px rgba(143,240,255,.55)}
.lyrics .msg{color:#7f8b98;font-size:13px}
.plist{align-self:stretch;height:100%;max-height:52vh;overflow-y:auto}
.plist button{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;width:100%;height:42px;padding:0 10px;border:1px solid transparent;border-radius:3px;background:none;text-align:left;cursor:pointer;color:#dce3ea}
.plist button:hover{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
.plist button.cur{color:#fff;border-color:#5aaee8;background:linear-gradient(#2c6ea6,#184c7c)}
.plist .n{font-size:12px;color:#6f7c89}.plist .cur .n{color:#fff}
.plist b{display:block;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist small{display:block;font-size:11px;color:#7f8b98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plist .cur small{color:#bfddf5}
.curlyric{min-height:19px;max-width:340px;text-align:center;font-family:var(--lcdfont);font-size:13px;color:rgba(143,240,255,.85);text-shadow:0 0 10px rgba(143,240,255,.5)}
.well{width:min(76vw,300px);aspect-ratio:1;border-radius:50%;padding:4.5%;
  background:radial-gradient(circle at 50% 50%,#0b0c0e 0 62%,#15171a 70%,#050506 100%);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.95),inset 0 -1px 0 rgba(255,255,255,.12),0 0 0 1px #2b2f35,0 0 0 5px #131518,0 0 0 6px #33383f,0 18px 40px rgba(0,0,0,.7)}
.disc{width:100%;height:100%;border-radius:50%;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.8)}
.disc .spin{position:absolute;inset:0;border-radius:50%;animation:spin 3.4s linear infinite;animation-play-state:paused;
  background:repeating-radial-gradient(circle at 50%,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,.05) 1px 3px),radial-gradient(circle,#dfe6ef 0 29%,#9aa7b8 30%,#e8edf4 45%,#c3ccd8 80%,#aab5c3 100%)}
.disc.on .spin{animation-play-state:running}
.disc .label{position:absolute;inset:24%;border-radius:50%;background:#1d2a39 center/cover no-repeat;box-shadow:0 0 0 2px rgba(255,255,255,.6),inset 0 0 10px rgba(0,0,0,.45)}
.disc .sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:.7;
  background:conic-gradient(from 20deg,transparent 0 6%,rgba(245,169,184,.8) 10%,rgba(255,240,170,.65) 14%,rgba(160,255,200,.55) 18%,rgba(91,206,250,.8) 22%,transparent 30% 56%,rgba(245,169,184,.6) 60%,rgba(255,240,170,.5) 64%,rgba(91,206,250,.75) 70%,transparent 78%);
  -webkit-mask:radial-gradient(circle,transparent 0 25%,#000 26% 99%,transparent 100%);mask:radial-gradient(circle,transparent 0 25%,#000 26% 99%,transparent 100%)}
.disc .hub{position:absolute;inset:44%;border-radius:50%;background:radial-gradient(circle,#050607 0 34%,#8c96a3 36%,#dfe5ec 52%,#7d8793 70%,#2a2f35 72%);box-shadow:0 1px 3px rgba(0,0,0,.7)}
@keyframes spin{to{transform:rotate(360deg)}}

.lcd{width:min(100%,340px);padding:10px 12px 9px;border-radius:4px;background:linear-gradient(#0a2025,var(--lcdBg));font-family:var(--lcdfont);color:var(--lcdOn);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 0 0 1px rgba(143,240,255,.08),0 0 0 1px #2a2f36,0 0 0 4px #121418,0 0 0 5px #30353c;text-shadow:0 0 6px rgba(143,240,255,.55)}
.lcd-top{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;line-height:1;letter-spacing:.04em}
.lcd-top small{font-size:10px;letter-spacing:.14em;margin-right:6px;opacity:.7}
.lcd-title{margin-top:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-transform:uppercase;letter-spacing:.06em}
.lcd-title span{display:inline-block;padding-right:40px}
.lcd-title.scroll span{animation:marquee var(--dur,10s) linear infinite}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lcd-sub{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.05em}
.lcd-ind{display:flex;gap:12px;margin-top:8px;font-size:10.5px;letter-spacing:.12em}
.lcd-ind span{color:var(--lcdOff);text-shadow:none}
.lcd-ind span.lit{color:var(--lcdOn);text-shadow:0 0 6px rgba(143,240,255,.6)}
.lcd-ind .fmt{margin-left:auto}
.rate{display:flex;align-items:center;gap:2px}
.rate button{background:none;border:0;padding:4px;cursor:pointer;color:#3a414b}
.rate button.on{color:var(--star);filter:drop-shadow(0 0 4px rgba(245,179,1,.5))}
.rate button svg{width:18px;height:18px}
.note{font-size:11.5px;color:#7f8b98;min-height:15px;text-align:center}

/* ---- the black control bar ---- */
.bar{flex:none;position:relative;color:#d8dde3;border:1px solid #000;border-top:0;
  background:linear-gradient(#3b3e43 0,#23262a 46%,#0a0b0d 50%,#141619 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.bar{border-radius:0 0 5px 5px;margin-bottom:5px}}
.seekrow{display:flex;align-items:center;gap:8px;padding:6px 12px 0;font-size:11px;color:#aeb6bf;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#3aa7ea,#9fdcff var(--p,0%),#2b2f35 var(--p,0%));box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#3aa7ea,#9fdcff var(--p,0%),#2b2f35 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4px;border-radius:50%;border:1px solid #0c3f68;background:radial-gradient(circle at 50% 30%,#fff,#a8dcff 55%,#3b92d4)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;border:1px solid #0c3f68;background:radial-gradient(circle at 50% 30%,#fff,#a8dcff 55%,#3b92d4)}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 10px 10px}
.side{display:flex;gap:4px;align-items:center}
.side.right{justify-content:flex-end}
.tb{width:34px;height:30px;display:grid;place-items:center;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;color:#cfd6de;padding:0}
.tb:hover{border-color:rgba(255,255,255,.18);background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.03))}
.tb[aria-pressed="true"]{color:#7fd0ff;border-color:rgba(127,208,255,.35);background:linear-gradient(rgba(127,208,255,.2),rgba(127,208,255,.05));box-shadow:0 0 8px rgba(80,180,255,.25)}
/* transport: a glass capsule with the orb sitting on it, like wmp 12 */
.transport{position:relative;display:flex;align-items:center;height:46px}
.cap{display:flex;align-items:center;height:30px;border-radius:15px;border:1px solid #000;
  background:linear-gradient(#5a5f66,#2b2f34 48%,#101214 52%,#23272b);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 rgba(255,255,255,.08)}
.cap button{width:46px;height:28px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:#dfe6ec;padding:0}
.cap button:first-child{padding-right:8px}
.cap button:last-child{padding-left:8px}
.cap button:hover{color:#fff;filter:drop-shadow(0 0 5px rgba(120,210,255,.9))}
.cap .gap{width:30px}
.playorb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;
  border:1px solid #000;background:radial-gradient(circle at 50% 30%,#8fd3ff 0,#2c86cf 36%,#0e3d6d 64%,#06182c 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.35),0 0 0 2px rgba(0,0,0,.45),0 0 14px rgba(58,167,234,.45)}
.playorb::before{content:"";position:absolute;left:12%;right:12%;top:4%;height:44%;border-radius:50% 50% 45% 45%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.playorb:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.35),0 0 0 2px rgba(0,0,0,.45),0 0 22px rgba(90,195,255,.85)}
.playorb svg{position:relative}
button:focus-visible{outline:1px dotted currentColor;outline-offset:2px}
.cap button:disabled,.tb:disabled{opacity:.35;cursor:default;filter:none}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffffe1;color:#000;border:1px solid #767676;padding:5px 10px;font-size:12px;box-shadow:2px 2px 4px rgba(0,0,0,.35);max-width:90vw}
@media (prefers-reduced-motion:reduce){.disc .spin,.lcd-title.scroll span{animation:none}}
</style>
</head>
<body>
<div class="win">
  <header class="title"><i class="ico"></i><span id="winTitle">okplayer</span><div class="caption" aria-hidden="true"><i></i><i></i><i class="x"></i></div></header>
  <nav class="toolbar">
    <button class="navbtn" id="navBack" aria-label="Back"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <button class="navbtn" id="navFwd" aria-label="Forward" disabled><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
    <div class="crumb" id="crumb"></div>
  </nav>
  <main class="pane dark" id="pane">
    <section class="np" id="vNow">
      <canvas id="viz"></canvas>
      <div class="tabs" role="tablist"><button data-v="disc" aria-pressed="true">Disc</button><button data-v="lyrics" aria-pressed="false">Lyrics</button><button data-v="list" aria-pressed="false">Play list</button></div>
      <div class="stage">
        <div class="well" id="well"><div class="disc" id="disc"><div class="spin"><div class="label" id="label"></div></div><div class="sheen"></div><div class="hub"></div></div></div>
        <div class="lyrics" id="lyrView" hidden></div>
        <div class="plist" id="listView" hidden></div>
      </div>
      <div class="lcd" id="lcd">
        <div class="lcd-top"><span><small>TRACK</small><span id="lcdTrack">--</span></span><span id="tNowLcd">-:--</span></div>
        <div class="lcd-title" id="lcdTitle"><span id="npTitle">NO DISC</span></div>
        <div class="lcd-sub" id="npArtist">ADD MUSIC OR PRESS PLAY FOR A DEMO</div>
        <div class="lcd-ind"><span id="iShuf">SHUF</span><span id="iLock">NO SKIP</span><span id="iFmt" class="fmt">--</span></div>
      </div>
      <div class="curlyric" id="curLyric"></div>
      <div class="rate" id="react" aria-label="Rating"></div>
      <div class="note" id="note"></div>
    </section>
    <section class="lib" id="vLib" hidden></section>
  </main>
  <footer class="bar">
    <div class="seekrow"><span id="tNow">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="tLen">0:00</span></div>
    <div class="ctl">
      <div class="side">

          <span class="gap"></span>

<script>
"use strict";
const $=q=>document.getElementById(q);
const audio=$("audio");
const ICON_PLAY='<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',ICON_STAR='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
const store={get(k,d){try{const v=localStorage.getItem("okp-"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("okp-"+k,JSON.stringify(v))}catch(e){}}};
let lib=store.get("lib",[]);          // [{id,title,artist,album,albumArtist,no,disc,dur,file,art}]
let ratings=store.get("ratings",{});
let prefs=store.get("prefs",{order:true,lock:false});
const mem=new Map();                   // id -> File/Blob for this session
const artUrl=new Map();                // art key -> object url
let queue=[],qi=-1,view="now",openAlbum=null;
const starsHtml=n=>`<span class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=n?"on":""}">${ICON_STAR}</span>`).join("")}</span>`;
const fmt=t=>!isFinite(t)||t<0?"0:00":`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=2600){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}
const saveLib=()=>store.set("lib",lib);

/* ---------- storage: origin private file system, falls back to session only ---------- */
let opfs=null;
async function getDir(name){if(!opfs){try{opfs=await navigator.storage.getDirectory()}catch(e){opfs=false}}if(!opfs)return null;return opfs.getDirectoryHandle(name,{create:true})}
async function putFile(dir,name,blob){try{const d=await getDir(dir);if(!d)return false;const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return true}catch(e){return false}}
async function getFile(dir,name){try{const d=await getDir(dir);if(!d)return null;return await (await d.getFileHandle(name)).getFile()}catch(e){return null}}
async function delFile(dir,name){try{const d=await getDir(dir);if(d)await d.removeEntry(name)}catch(e){}}

/* ---------- tag readers: FLAC, MP3 (ID3v2), M4A ---------- */
const td8=new TextDecoder("utf-8"),td1=new TextDecoder("latin1"),td16=new TextDecoder("utf-16le"),td16b=new TextDecoder("utf-16be");
async function readTags(file){
  const head=new DataView(await file.slice(0,Math.min(file.size,16*1024*1024)).arrayBuffer());
  const sig=String.fromCharCode(...new Uint8Array(head.buffer,0,Math.min(12,head.byteLength)));
  try{
    if(sig.startsWith("fLaC"))return flac(head);
    if(sig.startsWith("ID3"))return id3(head);
    if(sig.slice(4,8)==="ftyp")return await mp4(file);
  }catch(e){console.warn("tag read failed",file.name,e)}
  return {};
}
function flac(v){
  const t={};let p=4,last=false;
  while(!last&&p+4<=v.byteLength){
    const h=v.getUint8(p);last=!!(h&128);const type=h&127,len=(v.getUint8(p+1)<<16)|(v.getUint8(p+2)<<8)|v.getUint8(p+3);p+=4;
    if(p+len>v.byteLength)break;
    if(type===0){const sr=(v.getUint8(p+10)<<12)|(v.getUint8(p+11)<<4)|(v.getUint8(p+12)>>4);const hi=v.getUint8(p+13)&15;const tot=hi*2**32+v.getUint32(p+14);if(sr)t.dur=tot/sr}
    if(type===4){let q=p;const vl=v.getUint32(q,true);q+=4+vl;const n=v.getUint32(q,true);q+=4;
      for(let i=0;i<n;i++){const l=v.getUint32(q,true);q+=4;const s=td8.decode(new Uint8Array(v.buffer,q,l));q+=l;const k=s.indexOf("=");vc(t,s.slice(0,k).toUpperCase(),s.slice(k+1))}}
    if(type===6&&!t.pic){let q=p;const ptype=v.getUint32(q);q+=4;const ml=v.getUint32(q);q+=4;const mime=td1.decode(new Uint8Array(v.buffer,q,ml));q+=ml;const dl=v.getUint32(q);q+=4+dl+16;const n=v.getUint32(q);q+=4;
      const pic=new Blob([new Uint8Array(v.buffer,q,n)],{type:mime||"image/jpeg"});if(ptype===3||!t.pic)t.pic=pic}
    p+=len;
  }
  return t;
}
function vc(t,k,val){({TITLE:()=>t.title=val,ARTIST:()=>t.artist=t.artist||val,ALBUMARTIST:()=>t.albumArtist=val,ALBUM:()=>t.album=val,TRACKNUMBER:()=>t.no=parseInt(val),DISCNUMBER:()=>t.disc=parseInt(val)}[k]||(()=>{}))()}
function id3(v){
  const t={},ver=v.getUint8(3);const ss=o=>(v.getUint8(o)<<21)|(v.getUint8(o+1)<<14)|(v.getUint8(o+2)<<7)|v.getUint8(o+3);
  const end=Math.min(10+ss(6),v.byteLength);let p=10;
  if(ver<3)return t;
  if(v.getUint8(5)&64)p+=ver===4?ss(10):v.getUint32(10)+4;
  const txt=(o,n)=>{const e=v.getUint8(o),b=new Uint8Array(v.buffer,o+1,n-1);let s=e===0?td1.decode(b):e===3?td8.decode(b):e===2?td16b.decode(b):(b[0]===0xfe?td16b.decode(b.subarray(2)):td16.decode(b.subarray(2)));return s.replace(/\0+$/,"").split("\0")[0]};
  while(p+10<=end){
    const id=String.fromCharCode(v.getUint8(p),v.getUint8(p+1),v.getUint8(p+2),v.getUint8(p+3));if(!/^[A-Z0-9]{4}$/.test(id))break;
    const n=ver===4?ss(p+4):v.getUint32(p+4);const o=p+10;if(o+n>end||n<1)break;
    if(id==="TIT2")t.title=txt(o,n);else if(id==="TPE1")t.artist=txt(o,n);else if(id==="TPE2")t.albumArtist=txt(o,n);else if(id==="TALB")t.album=txt(o,n);
    else if(id==="TRCK")t.no=parseInt(txt(o,n));else if(id==="TPOS")t.disc=parseInt(txt(o,n));
    else if(id==="APIC"&&!t.pic){const e=v.getUint8(o);let q=o+1;let m="";while(q<o+n&&v.getUint8(q))m+=String.fromCharCode(v.getUint8(q++));q+=2;
      if(e===1||e===2){while(q+1<o+n&&(v.getUint8(q)||v.getUint8(q+1)))q+=2;q+=2}else{while(q<o+n&&v.getUint8(q))q++;q++}
      if(q<o+n)t.pic=new Blob([new Uint8Array(v.buffer,q,o+n-q)],{type:m.includes("/")?m:"image/"+(m||"jpeg").toLowerCase()})}
    p=o+n;
  }
  return t;
}
async function mp4(file){
  const t={};const rd=async(o,n)=>new DataView(await file.slice(o,o+n).arrayBuffer());
  let p=0,moov=null;
  while(p+8<=file.size){const h=await rd(p,16);let sz=h.getUint32(0);const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
    if(sz===1)sz=Number(h.getBigUint64(8));else if(sz===0)sz=file.size-p;if(sz<8)break;
    if(ty==="moov"){moov=await rd(p,sz);break}p+=sz}
  if(!moov)return t;
  const walk=(o,e,fn)=>{while(o+8<=e){const s=moov.getUint32(o),ty=String.fromCharCode(moov.getUint8(o+4),moov.getUint8(o+5),moov.getUint8(o+6),moov.getUint8(o+7));if(s<8)break;fn(ty,o+8,o+s);o+=s}};
  walk(8,moov.byteLength,(ty,o,e)=>{
    if(ty==="mvhd"){const vv=moov.getUint8(o);const ts=vv?moov.getUint32(o+20):moov.getUint32(o+12);const du=vv?Number(moov.getBigUint64(o+24)):moov.getUint32(o+16);if(ts)t.dur=du/ts}
    if(ty!=="udta")return;
    walk(o,e,(ty2,o2,e2)=>{if(ty2!=="meta")return;walk(o2+4,e2,(ty3,o3,e3)=>{if(ty3!=="ilst")return;walk(o3,e3,(k,o4,e4)=>{
      walk(o4,e4,(d,o5,e5)=>{if(d!=="data")return;const dt=moov.getUint32(o5)&0xffffff,b=new Uint8Array(moov.buffer,o5+8,e5-o5-8);
        const s=()=>td8.decode(b);
        if(k==="©nam")t.title=s();else if(k==="©ART")t.artist=s();else if(k==="aART")t.albumArtist=s();else if(k==="©alb")t.album=s();
        else if(k==="trkn"&&b.length>=4)t.no=(b[2]<<8)|b[3];else if(k==="disk"&&b.length>=4)t.disc=(b[2]<<8)|b[3];
        else if(k==="covr"&&!t.pic)t.pic=new Blob([b.slice()],{type:dt===14?"image/png":"image/jpeg"})})})})});
  });
  return t;
}

/* ---------- import ---------- */
function fromName(file){
  const base=file.name.replace(/\.[^.]+$/,""),m=base.match(/^(\d{1,3})[\s._-]+(.+)$/);
  const parts=(file.webkitRelativePath||"").split("/");
  return {no:m?parseInt(m[1]):undefined,title:m?m[2]:base,album:parts.length>2?parts[parts.length-2]:undefined};
}
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
async function importFiles(list){
  const files=[...list].filter(f=>/\.(flac|mp3|m4a|aac|mp4|ogg|opus|wav)$/i.test(f.name)||f.type.startsWith("audio/"));
  if(!files.length){toast("No audio files found there.");return}
  let saved=0,sessionOnly=0,i=0;
  for(const f of files){
    i++;$("winTitle").textContent=`importing ${i}/${files.length} — ${f.name}`;
    const id=hash(f.name+f.size+(f.webkitRelativePath||""));
    if(lib.some(x=>x.id===id))continue;
    const tg=await readTags(f),fn=fromName(f);
    const tr={id,title:tg.title||fn.title,artist:tg.artist||"unknown artist",album:tg.album||fn.album||"unknown album",albumArtist:tg.albumArtist||tg.artist||"unknown artist",no:tg.no||fn.no||0,disc:tg.disc||1,dur:tg.dur||0,file:f.name};
    const key=albumKey(tr);
    if(tg.pic&&!artUrl.has(key)){artUrl.set(key,URL.createObjectURL(tg.pic));await putFile("art",key,tg.pic);tr.art=key}
    else if(artUrl.has(key))tr.art=key;
    mem.set(id,f);
    if(await putFile("music",id,f)){tr.stored=true;saved++}else sessionOnly++;
    lib.push(tr);
  }
  lib.forEach(t=>{const k=albumKey(t);if(!t.art&&artUrl.has(k))t.art=k});
  saveLib();$("winTitle").textContent="okplayer";
  toast(sessionOnly?`Added ${files.length} songs. ${sessionOnly} couldn't be saved in the player, so add those again next time.`:`Added ${files.length} songs to your library.`,4000);
  openAlbum=null;show("lib");
}
$("pickFiles").onchange=e=>{importFiles(e.target.files);e.target.value=""};
$("pickDir").onchange=e=>{importFiles(e.target.files);e.target.value=""};

/* ---------- library view ---------- */
function albumKey(t){return hash((t.albumArtist||t.artist)+"|"+t.album)}
function albums(){
  const m=new Map();lib.forEach(t=>{const k=albumKey(t);if(!m.has(k))m.set(k,{key:k,album:t.album,artist:t.albumArtist||t.artist,tracks:[]});m.get(k).tracks.push(t)});
  const a=[...m.values()];a.forEach(x=>x.tracks.sort((p,q)=>(p.disc-q.disc)||(p.no-q.no)||p.title.localeCompare(q.title)));
  return a.sort((p,q)=>p.artist.localeCompare(q.artist)||p.album.localeCompare(q.album));
}
async function art(key){if(!key)return null;if(artUrl.has(key))return artUrl.get(key);const f=await getFile("art",key);if(!f)return null;const u=URL.createObjectURL(f);artUrl.set(key,u);return u}
function genCover(el,name){const h=parseInt(hash(name),36)%360;el.classList.add("gen");el.style.background=`linear-gradient(135deg,hsl(${h} 55% 55%),hsl(${(h+50)%360} 60% 30%))`;el.textContent=(name||"?").trim()[0]?.toUpperCase()||"?"}
function renderLib(){
  const v=$("vLib");
  if(openAlbum){const a=albums().find(x=>x.key===openAlbum);if(a)return renderAlbum(a);openAlbum=null}
  const as=albums();
  v.innerHTML=`<div class="cmdbar"><button class="cmd" id="addF">Add songs</button><button class="cmd" id="addD">Add folder</button><span class="count">${as.length} albums, ${lib.length} songs</span></div>
    ${lib.length?`<div class="group">Albums</div>`:`<div class="hint">Your library is empty. Add FLAC, MP3, M4A or OGG files and they're copied into the player, so they're still here next time.</div>`}
    <div class="grid" id="albGrid"></div>`;
  $("addF").onclick=()=>$("pickFiles").click();$("addD").onclick=()=>$("pickDir").click();
  as.forEach(a=>{const b=document.createElement("button");b.className="tile";b.innerHTML=`<div class="cover"></div><b>${esc(a.album)}</b><small>${esc(a.artist)}</small>`;
    const c=b.querySelector(".cover");art(a.tracks.find(t=>t.art)?.art).then(u=>u?c.style.backgroundImage=`url("${u}")`:genCover(c,a.album));
    b.onclick=()=>{openAlbum=a.key;renderLib();crumbs();$("pane").scrollTop=0};$("albGrid").appendChild(b)});
}
function renderAlbum(a){
  const v=$("vLib"),total=a.tracks.reduce((s,t)=>s+(t.dur||0),0);
  v.innerHTML=`<div class="cmdbar"><button class="cmd" id="playAll">Play</button><button class="cmd" id="shufAll">Shuffle</button><button class="cmd" id="rm">Remove from library</button></div>
    <div class="ahead"><div class="cover"></div><div><h2>${esc(a.album)}</h2><p>${esc(a.artist)}</p><p>${a.tracks.length} songs${total?`, ${Math.round(total/60)} minutes`:""}</p></div></div>
    <div class="cols"><span>#</span><span>Title</span><span>Rating</span><span style="text-align:right">Length</span></div>
    <div id="tl"></div>`;
  const c=v.querySelector(".cover");art(a.tracks.find(t=>t.art)?.art).then(u=>u?c.style.backgroundImage=`url("${u}")`:genCover(c,a.album));
  $("playAll").onclick=()=>{setMode(true);playList(a.tracks,0);show("now")};
  $("shufAll").onclick=()=>{if(prefs.lock){toast("Turn off No skipping to shuffle.");return}setMode(false);playList(a.tracks,0);show("now")};
  $("rm").onclick=async e=>{if(e.target.dataset.sure!=="1"){e.target.dataset.sure="1";e.target.textContent="Tap again to remove";return}
    for(const t of a.tracks){await delFile("music",t.id);mem.delete(t.id)}await delFile("art",a.key);lib=lib.filter(t=>albumKey(t)!==a.key);saveLib();openAlbum=null;renderLib();crumbs();toast("Album removed.")};
  const cur=queue[qi]?.id;
  a.tracks.forEach((t,i)=>{const b=document.createElement("button");b.className="trk"+(t.id===cur?" cur":"");
    b.innerHTML=`<span class="n">${t.no||i+1}</span><span class="t">${esc(t.title)}</span>${starsHtml(ratings[t.id]||0)}<span class="d">${t.dur?fmt(t.dur):""}</span>`;
    b.onclick=()=>{playList(a.tracks,i);show("now")};$("tl").appendChild(b)});
}

/* ---------- playback ---------- */
let actx,analyser,freq;
function setupAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaElementSource(audio);analyser=actx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;freq=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);analyser.connect(actx.destination)}catch(e){analyser=null}}
async function blobFor(t){if(mem.has(t.id))return mem.get(t.id);if(t.demo)return demoWav();const f=await getFile("music",t.id);if(f)mem.set(t.id,f);return f}
let curUrl=null,unlocked=false;
function playList(tracks,start){
  const base=[...tracks];
  if(!prefs.order){const first=base.splice(start,1)[0];for(let i=base.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[base[i],base[j]]=[base[j],base[i]]}base.unshift(first);start=0}
  queue=base;load(start,true);
}
async function load(i,autoplay){
  if(i<0||i>=queue.length)return;qi=i;const t=queue[i];unlocked=false;
  const b=await blobFor(t);
  if(!b){toast(`"${t.title}" isn't saved in the player. Add the file again.`,4000);return}
  if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(b);audio.src=curUrl;
  store.set("last",{ids:queue.map(x=>x.id),qi:i});
  renderNow();
  if(autoplay){setupAudio();actx?.resume();audio.play().catch(()=>{})}
  const u=await art(t.art);$("label").style.backgroundImage=u?`url("${u}")`:"";
  if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:u?[{src:u,sizes:"512x512"}]:[]})}
}
function next(auto){if(prefs.lock&&!auto&&!unlocked){toast("No skipping is on. Finish the song first.");return}if(qi+1<queue.length)load(qi+1,true);else if(auto){audio.pause();toast("End of the album.")}}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return}if(prefs.lock){toast("No skipping is on.");return}if(qi>0)load(qi-1,true)}
$("play").onclick=()=>{if(!queue.length){playDemo();return}setupAudio();actx?.resume();audio.paused?audio.play():audio.pause()};
$("next").onclick=()=>next(false);$("prev").onclick=prev;
audio.onended=()=>{unlocked=true;next(true)};
audio.onerror=()=>{const t=queue[qi];if(!t||!audio.src)return;
  const ext=(t.file||"").split(".").pop().toUpperCase();
  toast(`Couldn't play “${t.title}”: this browser can't decode ${ext==="M4A"?"this M4A (it may be ALAC)":"this "+ext+" file"}. The Android app can.`,5000);
  unlocked=true;if(qi+1<queue.length)load(qi+1,true)};
audio.onplay=audio.onpause=()=>{const on=!audio.paused;$("disc").classList.toggle("on",on);$("play").innerHTML=on?ICON_PAUSE:ICON_PLAY;$("play").setAttribute("aria-label",on?"Pause":"Play");if("mediaSession" in navigator)navigator.mediaSession.playbackState=on?"playing":"paused"};
audio.onloadedmetadata=()=>{const t=queue[qi];if(t&&!t.dur&&isFinite(audio.duration)){t.dur=audio.duration;const l=lib.find(x=>x.id===t.id);if(l){l.dur=t.dur;saveLib()}}$("tLen").textContent=fmt(audio.duration);if(queue[qi]&&isFinite(audio.duration))fetchLyrics(queue[qi],audio.duration)};
audio.ontimeupdate=()=>{if(seeking)return;const d=audio.duration||0,p=d?audio.currentTime/d*1000:0;$("seek").value=p;$("seek").style.setProperty("--p",p/10+"%");$("tNow").textContent=fmt(audio.currentTime);$("tNowLcd").textContent=fmt(audio.currentTime);tickLyrics();
  if("mediaSession" in navigator&&d&&isFinite(d))try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(audio.currentTime,d),playbackRate:1})}catch(e){}};
let seeking=false;
$("seek").oninput=e=>{seeking=true;const d=audio.duration||0,to=e.target.value/1000*d;
  if(prefs.lock&&to>audio.currentTime+1){e.target.value=audio.currentTime/d*1000;toast("No skipping is on.");seeking=false;return}
  e.target.style.setProperty("--p",e.target.value/10+"%");$("tNow").textContent=fmt(to)};
$("seek").onchange=e=>{const d=audio.duration||0,to=e.target.value/1000*d;if(!(prefs.lock&&to>audio.currentTime+1))audio.currentTime=to;seeking=false};
if("mediaSession" in navigator){const ms=navigator.mediaSession;
  ms.setActionHandler("play",()=>audio.play());ms.setActionHandler("pause",()=>audio.pause());
  ms.setActionHandler("nexttrack",()=>next(false));ms.setActionHandler("previoustrack",prev);
  try{ms.setActionHandler("seekto",d=>{if(!(prefs.lock&&d.seekTime>audio.currentTime))audio.currentTime=d.seekTime})}catch(e){}}

/* ---------- modes + reactions ---------- */
function setMode(order){prefs.order=order;store.set("prefs",prefs);renderModes()}
function renderModes(){$("mShuffle").setAttribute("aria-pressed",!prefs.order);$("mLock").setAttribute("aria-pressed",prefs.lock);
  $("iShuf").classList.toggle("lit",!prefs.order);$("iLock").classList.toggle("lit",prefs.lock);
  $("next").disabled=prefs.lock;$("note").textContent=prefs.lock?"No skipping is on. The next song unlocks when this one ends.":""}
$("mShuffle").onclick=()=>{if(prefs.lock){toast("Turn off No skipping to shuffle.");return}setMode(!prefs.order);toast(prefs.order?"Shuffle off.":"Shuffle on. It applies to the next album you play.")};
$("mLock").onclick=()=>{prefs.lock=!prefs.lock;if(prefs.lock)prefs.order=true;store.set("prefs",prefs);renderModes()};
function renderReact(){const r=$("react"),t=queue[qi];r.innerHTML="";r.hidden=!t||t.demo;if(!t)return;const n=ratings[t.id]||0;
  for(let i=1;i<=5;i++){const b=document.createElement("button");b.innerHTML=ICON_STAR;b.className=i<=n?"on":"";b.setAttribute("aria-label",`Rate ${i} star${i>1?"s":""}`);
    b.onclick=()=>{ratings[t.id]=ratings[t.id]===i?0:i;store.set("ratings",ratings);renderReact()};r.appendChild(b)}}

/* ---------- views ---------- */
/* ---------- deck views, lyrics ---------- */
let deck="disc",lyr={id:null,status:"none",lines:[],synced:false},lyrIdx=-2;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{deck=deck===b.dataset.v?"disc":b.dataset.v;renderDeck()});
function renderDeck(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===deck));
  $("well").hidden=deck!=="disc";$("lyrView").hidden=deck!=="lyrics";$("listView").hidden=deck!=="list";
  $("curLyric").hidden=deck!=="disc";
  if(deck==="lyrics")renderLyrics();if(deck==="list")renderList();
}
function renderList(){
  const v=$("listView");v.innerHTML=queue.length?"":'<p class="msg" style="text-align:center;color:#7f8b98">The play list is empty.</p>';
  queue.forEach((t,i)=>{const b=document.createElement("button");b.className=i===qi?"cur":"";
    b.innerHTML=`<span class="n">${i+1}</span><span><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></span>`;
    b.onclick=()=>{if(prefs.lock&&i!==qi){toast("No skipping is on. Finish this song first.");return}load(i,true)};v.appendChild(b)});
  v.querySelector(".cur")?.scrollIntoView({block:"center"});
}
function parseLrc(text){
  const re=/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g,timed=[],plain=[];
  for(const raw of text.split(/\r?\n/)){const stamps=[...raw.matchAll(re)],body=raw.replace(re,"").trim();
    if(!stamps.length){if(!raw.trim().startsWith("["))plain.push({t:null,text:raw.trim()});continue}
    for(const m of stamps){const f=m[3]||"",ms=f.length===0?0:f.length===1?+f*100:f.length===2?+f*10:+f.slice(0,3);timed.push({t:+m[1]*60000+ +m[2]*1000+ms,text:body})}}
  if(timed.length)return{lines:timed.sort((a,b)=>a.t-b.t),synced:true};
  if(plain.some(l=>l.text))return{lines:plain,synced:false};return null;
}
async function fetchLyrics(t,dur){
  if(!t||t.demo||lyr.id===t.id)return;
  lyr={id:t.id,status:"searching",lines:[],synced:false};lyrIdx=-2;renderLyrics();
  const key="okp-lyr-"+t.id;let text=null;
  try{text=localStorage.getItem(key)}catch(e){}
  if(text===null){
    try{const q=new URLSearchParams({artist_name:t.artist,track_name:t.title,album_name:t.album,duration:Math.round(dur)});
      let r=await fetch("https://lrclib.net/api/get?"+q);let j=r.ok?await r.json():null;
      if(!j){r=await fetch("https://lrclib.net/api/search?"+new URLSearchParams({track_name:t.title,artist_name:t.artist}));
        const arr=r.ok?await r.json():[];j=arr.find(x=>Math.abs((x.duration||0)-dur)<4)||null}
      text=(j&&(j.syncedLyrics||j.plainLyrics))||"";try{localStorage.setItem(key,text)}catch(e){}
    }catch(e){text=""}
  }
  if(lyr.id!==t.id)return;
  const p=text?parseLrc(text):null;lyr=p?{id:t.id,status:"found",...p}:{id:t.id,status:"none",lines:[],synced:false};lyrIdx=-2;renderLyrics();tickLyrics();
}
function renderLyrics(){
  const v=$("lyrView");if(v.hidden&&deck!=="lyrics")return;
  v.classList.toggle("plain",!lyr.synced);
  v.innerHTML=lyr.status==="searching"?'<p class="msg">Looking for lyrics…</p>':lyr.status==="none"?'<p class="msg">No lyrics found for this song.</p>':
    lyr.lines.map((l,i)=>`<p data-i="${i}">${esc(l.text)||"&nbsp;"}</p>`).join("");lyrIdx=-2;tickLyrics();
}
function tickLyrics(){
  if(lyr.status!=="found"||!lyr.synced){$("curLyric").textContent="";return}
  const ms=audio.currentTime*1000;let i=-1;for(let k=0;k<lyr.lines.length;k++){if(lyr.lines[k].t<=ms)i=k;else break}
  if(i===lyrIdx)return;lyrIdx=i;$("curLyric").textContent=i>=0?(lyr.lines[i].text||"♪"):"♪";
  const v=$("lyrView");v.querySelectorAll("p.on").forEach(p=>p.classList.remove("on"));
  const p=v.querySelector(`p[data-i="${i}"]`);if(p){p.classList.add("on");if(!v.hidden)v.scrollTo({top:p.offsetTop-v.clientHeight/2+p.clientHeight/2})}
}

function renderNow(){
  const t=queue[qi],has=!!t;
  $("npTitle").textContent=(has?t.title:"no disc").toUpperCase();
  $("npArtist").textContent=has?`${t.artist} — ${t.album}`:lib.length?"pick an album in the library":"add music or press play for a demo";
  $("lcdTrack").textContent=has?String(qi+1).padStart(2,"0"):"--";
  $("iFmt").textContent=has?fileFormat(t):"--";$("iFmt").classList.toggle("lit",has);
  $("tLen").textContent=has&&t.dur?fmt(t.dur):"0:00";
  $("winTitle").textContent=has?`${t.title} - okplayer`:"okplayer";
  if(!has)$("label").style.backgroundImage="";
  marquee();renderReact();renderModes();
  if(!has||lyr.id!==t.id){$("curLyric").textContent="";if(!has)lyr={id:null,status:"none",lines:[],synced:false}}
  renderDeck();
}
function fileFormat(t){if(t.demo)return "WAV";const e=(t.file||"").split(".").pop().toUpperCase();return e||"--"}
function marquee(){const box=$("lcdTitle"),sp=$("npTitle");box.classList.remove("scroll");sp.textContent=sp.textContent.split(" ")[0];
  requestAnimationFrame(()=>{if(sp.scrollWidth>box.clientWidth){const txt=sp.textContent;sp.textContent=txt+" "+txt;box.style.setProperty("--dur",Math.max(8,txt.length*.35)+"s");box.classList.add("scroll")}})}
function crumbs(){
  const c=$("crumb"),a=openAlbum&&albums().find(x=>x.key===openAlbum);
  const parts=view==="now"?[["Now Playing"]]:a?[["Library","lib"],["Albums","albums"],[a.album]]:[["Library","lib"],["Albums"]];
  c.innerHTML=parts.map(([l,go],i)=>(i?'<span class="sep">▸</span>':"")+(go?`<button data-go="${go}">${esc(l)}</button>`:`<b>${esc(l)}</b>`)).join("");
  c.querySelectorAll("button").forEach(b=>b.onclick=()=>{openAlbum=null;show("lib")});
  $("navBack").disabled=view==="lib"&&!a;
}
function show(v){view=v;$("vNow").hidden=v!=="now";$("vLib").hidden=v!=="lib";$("pane").classList.toggle("dark",v==="now");
  $("pNow").setAttribute("aria-label",v==="now"?"Switch to library":"Switch to Now Playing");
  if(v==="lib")renderLib();else renderNow();crumbs();$("pane").scrollTop=0}
$("pNow").onclick=()=>show(view==="now"?"lib":"now");
$("navBack").onclick=()=>{if(view==="now")show("lib");else if(openAlbum){openAlbum=null;renderLib();crumbs()}};
$("play").innerHTML=ICON_PLAY;

/* ---------- demo track: a 40 second pad synthesized on the spot ---------- */
let demoBlob=null;
function demoWav(){if(demoBlob)return demoBlob;const sr=22050,n=sr*40,d=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));w(0,"RIFF");d.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*2,true);
  const chords=[[220,277.2,329.6,440],[196,246.9,293.7,392],[174.6,220,261.6,349.2],[196,246.9,293.7,370]];let seed=1;const rnd=()=>(seed=seed*16807%2147483647)/2147483647-.5;
  for(let i=0;i<n;i++){const t=i/sr,c=chords[Math.floor(t/5)%4],env=Math.min(1,t/2,(40-t)/3);let s=0;c.forEach((f,k)=>s+=Math.sin(2*Math.PI*f*t+Math.sin(t*.7+k))*.12);
    const step=Math.floor(t*4),ft=t*4-step,note=c[step%4]*2;s+=Math.sin(2*Math.PI*note*t)*Math.exp(-ft*5)*.18;s+=rnd()*.012;d.setInt16(44+i*2,Math.max(-1,Math.min(1,s*env))*32767,true)}
  return demoBlob=new Blob([d.buffer],{type:"audio/wav"})}
function playDemo(){queue=[{id:"demo",demo:true,title:"okplayer demo loop",artist:"okplayer",album:"test pressing",dur:40}];load(0,true)}

/* ---------- visualizer ---------- */
const cv=$("viz"),g=cv.getContext("2d");let W=0,H=0,ph=0;
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dp;cv.height=H*dp;g.setTransform(dp,0,0,dp,0,0)}
new ResizeObserver(size).observe($("vNow"));
const blobs=[["#3aa7ea",.18,.22],["#f5a9b8",.84,.3],["#5bcefa",.5,.5],["#3aa7ea",.86,.86],["#c9b8ff",.1,.8]];
function draw(){
  if(!$("vNow").hidden&&W){
    const on=!audio.paused;let bass=0,bins=null;
    if(on&&analyser){analyser.getByteFrequencyData(freq);bins=freq;for(let i=0;i<8;i++)bass+=freq[i];bass/=8*255}
    ph+=on?.012:.002;
    g.fillStyle="#050607";g.fillRect(0,0,W,H);g.globalCompositeOperation="lighter";
    blobs.forEach(([c,x,y],i)=>{const px=W*(x+.08*Math.sin(ph+i*1.7)),py=H*(y+.06*Math.cos(ph*.8+i)),rad=Math.max(W,H)*(.3+bass*.25);
      const gr=g.createRadialGradient(px,py,0,px,py,rad);gr.addColorStop(0,c+(on?Math.round(14+bass*36).toString(16).padStart(2,"0"):"0c"));gr.addColorStop(1,c+"00");g.fillStyle=gr;g.fillRect(0,0,W,H)});
    g.globalCompositeOperation="source-over";
  }
  if(!still)requestAnimationFrame(draw);
}
draw();if(still)setInterval(draw,1000);

/* ---------- boot ---------- */
(async()=>{
  const last=store.get("last",null);
  if(last&&lib.length){const q=last.ids.map(id=>lib.find(t=>t.id===id)).filter(Boolean);if(q.length){queue=q;await load(Math.min(last.qi,q.length-1),false)}}
  show("now");
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
