<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123a5e">
<title>okplayer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light;
  --sky1:#1c5f94; --sky2:#3a9bd5; --sky3:#0b2f55;
  --glass:rgba(185,215,240,.55); --glassEdge:rgba(255,255,255,.7);
  --pane:#ffffff; --side:#eef4fa; --ink:#1e2b37; --muted:#6b7c8c; --line:#d5e1ec;
  --sel:#cde8ff; --selEdge:#7eb4ea;
  --np:#0d1520; --npInk:#e6f1ff; --npDim:#8aa3bd; --tp:#f5a9b8; --tb:#5bcefa;
  --ui:"Segoe UI",Tahoma,"Noto Sans",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--ui);color:var(--ink);display:flex;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 0;
  background:radial-gradient(ellipse at 20% 110%,#7ed3ff 0,transparent 45%),radial-gradient(ellipse at 90% -10%,#2a86c9 0,transparent 50%),linear-gradient(160deg,var(--sky2),var(--sky1) 45%,var(--sky3)) fixed;}
.app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
@media (min-width:700px){.app{height:calc(100% - 48px);margin-top:24px}}

/* aero window */
.win{flex:1;min-height:0;display:flex;flex-direction:column;margin:8px 8px 0;border-radius:8px 8px 0 0;padding:0 6px;background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(20,40,60,.55);border-bottom:0;box-shadow:inset 0 0 0 1px var(--glassEdge),0 18px 50px rgba(0,10,30,.45)}
@media (min-width:700px){.win{border-radius:8px;border-bottom:1px solid rgba(20,40,60,.55);padding-bottom:6px;margin:0}}
.title{display:flex;align-items:center;gap:8px;height:32px;padding-left:4px;color:#10212f;text-shadow:0 0 10px #fff,0 0 6px #fff;flex:none}
.title .ico{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffb63b 40%,#e2610b);flex:none}
.title span{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-self:flex-start;flex:none}
.ctl i{width:27px;height:19px;border:1px solid rgba(30,50,70,.6);border-top:0;background:linear-gradient(#e9f2fb,#bcd3e8 50%,#a9c4dc 51%,#d6e6f4)}
.ctl i:first-child{border-radius:0 0 0 5px}
.ctl i:last-child{width:46px;border-radius:0 0 5px 0;background:linear-gradient(#f0a79b,#d9573f 50%,#c43b22 51%,#e98b6c)}
.pane{flex:1;min-height:0;overflow-y:auto;background:var(--pane);border:1px solid rgba(20,40,60,.5);border-bottom:0;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.pane{border-bottom:1px solid rgba(20,40,60,.5)}}

/* now playing */
.np{background:var(--np);color:var(--npInk);min-height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.np canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.np > *:not(canvas){position:relative}
.discwrap{display:flex;justify-content:center;padding:28px 16px 14px}
.disc{width:min(68vw,290px);aspect-ratio:1;border-radius:50%;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.15)}
.disc .spin{position:absolute;inset:0;border-radius:50%;animation:spin 3.2s linear infinite;animation-play-state:paused;
  background:repeating-radial-gradient(circle at 50%,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.05) 1px 3px),radial-gradient(circle,#dfe6ef 0 30%,#aab6c6 31%,#e9eef5 70%,#b9c4d2 100%)}
.disc.on .spin{animation-play-state:running}
.disc .label{position:absolute;inset:25%;border-radius:50%;background:#26384f center/cover no-repeat;box-shadow:0 0 0 3px rgba(255,255,255,.55),inset 0 0 12px rgba(0,0,0,.35);overflow:hidden}
.disc .label::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,rgba(255,255,255,.35) 50%,transparent 52%)}
.disc .sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:.75;
  background:conic-gradient(from 20deg,transparent 0 6%,rgba(245,169,184,.8) 10%,rgba(255,240,170,.7) 14%,rgba(160,255,200,.6) 18%,rgba(91,206,250,.8) 22%,transparent 30% 56%,rgba(245,169,184,.7) 60%,rgba(255,240,170,.6) 64%,rgba(91,206,250,.8) 70%,transparent 78%);
  -webkit-mask:radial-gradient(circle,transparent 0 26%,#000 27% 99%,transparent 100%);mask:radial-gradient(circle,transparent 0 26%,#000 27% 99%,transparent 100%)}
.disc .hole{position:absolute;inset:46.5%;border-radius:50%;background:var(--np);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{text-align:center;padding:0 20px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.meta .tn{font-size:21px;font-weight:300;line-height:1.2;overflow-wrap:anywhere}
.meta .ar{color:var(--npDim);font-size:13px;margin-top:2px}
.seek{padding:14px 20px 4px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tb),#fff var(--p,0%),#2a394a var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tb),#fff var(--p,0%),#2a394a var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-5px;background:radial-gradient(circle at 50% 30%,#fff,#9fd8ff 60%,#3b95d8);border:1px solid #0a3563}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,#9fd8ff 60%,#3b95d8);border:1px solid #0a3563}
input[type=range]:disabled{opacity:.5}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--npDim);font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 16px 6px}
.orbbtn{border-radius:50%;border:1px solid #0a2a4a;cursor:pointer;color:#fff;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#bfe6ff,#3b95d8 45%,#0e4f8c 70%,#0a3563);box-shadow:0 0 14px rgba(91,206,250,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.orbbtn.big{width:64px;height:64px;font-size:22px}
.orbbtn.sm{width:42px;height:42px;font-size:14px;background:radial-gradient(circle at 50% 30%,#e7eef6,#7d93ab 50%,#34495f 75%,#1d2c3c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.orbbtn:disabled{filter:grayscale(1);opacity:.4;cursor:default}
.orbbtn:focus-visible,.chip:focus-visible,.btn:focus-visible,.tog:focus-visible,.alb:focus-visible,.trk:focus-visible,.pin:focus-visible{outline:2px dotted #fff;outline-offset:2px}
.modes{display:flex;justify-content:center;gap:8px;padding:6px 16px}
.tog{font:12px var(--ui);color:var(--npDim);background:#16233a;border:1px solid #2e4260;border-radius:12px;padding:4px 11px;cursor:pointer}
.tog[aria-pressed="true"]{color:#fff;background:#23466f;border-color:var(--tb);box-shadow:0 0 8px rgba(91,206,250,.35)}
.react{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 16px 18px}
.chip svg,.tog svg,.pin svg{vertical-align:-3px}
.lv{color:#e0708a}.lv svg{width:12px;height:12px;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;gap:6px;font:13px var(--ui);color:var(--npInk);background:rgba(34,50,74,.8);border:1px solid #3a5270;border-radius:14px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"] svg{color:var(--tp)}
.chip[aria-pressed="true"]{background:#4a2c44;border-color:var(--tp);box-shadow:0 0 8px rgba(245,169,184,.4)}
.note{font-size:12px;color:var(--npDim);text-align:center;padding:0 20px;min-height:16px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px 20px;text-align:center}

/* library */
.lib{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:100%;background:linear-gradient(#fff,#f3f7fb)}
.lib h2{margin:0;font-size:18px;font-weight:400;color:#1b3a57}
.lib .sub{color:var(--muted);font-size:12px}
.btn{font:13px var(--ui);padding:6px 14px;border-radius:3px;border:1px solid #707070;background:linear-gradient(#f2f2f2,#ebebeb 50%,#dddddd 51%,#cfcfcf);cursor:pointer;color:#111;white-space:nowrap}
.btn:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd,#d9f0fc 50%,#bee6fd 51%,#a7d9f5)}
.btn.warn{border-color:#a33}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.alb{border:1px solid transparent;border-radius:4px;padding:6px;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.alb:hover{background:#e5f3ff;border-color:#b8d6fb}
.cov{aspect-ratio:1;width:100%;border-radius:2px;background:#26384f center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;overflow:hidden}
.cov.gen{display:grid;place-items:center;color:#fff;font-size:30px;font-weight:300}
.alb b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.ahead{display:flex;gap:14px;align-items:flex-end}
.ahead .cov{width:120px;flex:none}
.ahead div{min-width:0}
.tracks{border:1px solid var(--line);border-radius:3px;background:#fff}
.trk{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.trk:first-child{border-top:0}
.trk:nth-child(even){background:#f7fafd}
.trk.cur{background:linear-gradient(#f2f9ff,#e2f0fd);box-shadow:inset 0 0 0 1px var(--selEdge)}
.trk .n{color:var(--muted);font-variant-numeric:tabular-nums}
.trk .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .d{color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:12px;background:#fff8dc;border:1px solid #e8d48b;border-radius:3px;padding:6px 10px;color:#6a5516}
.back{background:none;border:0;color:#1d5fa0;font:13px var(--ui);cursor:pointer;padding:0;align-self:flex-start}

/* taskbar */
.taskbar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(40,70,100,.6),rgba(10,25,40,.88));border-top:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
@media (min-width:700px){.taskbar{border-radius:0 0 8px 8px;margin-top:8px;border:1px solid rgba(255,255,255,.25)}}
.orb{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;flex:none;position:relative;background:radial-gradient(circle at 50% 30%,#d9f6c8,#4fa83b 40%,#1f5f23 70%,#113a14);box-shadow:0 0 10px rgba(120,255,140,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.orb::after{content:"";position:absolute;inset:11px;background:conic-gradient(#f25022 0 25%,#7fba00 0 50%,#00a4ef 0 75%,#ffb900 0);border-radius:2px}
.pin{height:36px;border-radius:3px;display:flex;align-items:center;gap:6px;font:12px var(--ui);color:#fff;padding:0 12px;border:1px solid transparent;background:none;cursor:pointer;min-width:0}
.pin[aria-selected="true"]{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.08));border-color:rgba(255,255,255,.4)}
.pin span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tray{margin-left:auto;text-align:center;font-size:11px;line-height:1.2;font-variant-numeric:tabular-nums;flex:none}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fffbe6;color:#3d3212;border:1px solid #bfa54a;border-radius:3px;padding:6px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw}
@media (prefers-reduced-motion:reduce){.disc .spin{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="win">
    <div class="title"><i class="ico"></i><span id="winTitle">okplayer</span><div class="ctl" aria-hidden="true"><i></i><i></i><i></i></div></div>
    <div class="pane" id="pane">

      <section class="np" id="vNow">
        <canvas id="viz"></canvas>
        <div class="discwrap"><div class="disc" id="disc"><div class="spin"><div class="label" id="label"></div></div><div class="sheen"></div><div class="hole"></div></div></div>
        <div id="npBody">
          <div class="meta"><div class="tn" id="npTitle">nothing playing</div><div class="ar" id="npArtist">add music or play the demo</div></div>
          <div class="seek"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div class="times"><span id="tNow">0:00</span><span id="tLen">0:00</span></div></div>
          <div class="ctrl">
            <button class="orbbtn sm" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button class="orbbtn big" id="play" aria-label="Play"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
            <button class="orbbtn sm" id="next" aria-label="Next"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
          </div>
          <div class="note" id="note"></div>
          <div class="modes">
            <button class="tog" id="mOrder" aria-pressed="true">in order</button>
            <button class="tog" id="mShuffle" aria-pressed="false">shuffle</button>
            <button class="tog" id="mLock" aria-pressed="false"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg> no skipping</button>
          </div>
          <div class="react" id="react"></div>
        </div>
        <div class="empty" id="npEmpty" hidden></div>
      </section>

      <section class="lib" id="vLib" hidden></section>
    </div>
  </div>
  <div class="taskbar">
    <button class="orb" id="orb" aria-label="Add music"></button>
    <button class="pin" id="pLib" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg><span>library</span></button>
    <button class="pin" id="pNow" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg><span id="pNowTxt">now playing</span></button>
    <div class="tray" id="clock"></div>
  </div>
</div>
<input type="file" id="pickFiles" multiple accept="audio/*,.flac,.mp3,.m4a,.aac,.ogg,.opus,.wav" hidden>
<input type="file" id="pickDir" webkitdirectory multiple hidden>
<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $=q=>document.getElementById(q);
const audio=$("audio");
const ICON_PLAY='<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',ICON_HEART='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const store={get(k,d){try{const v=localStorage.getItem("okp-"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("okp-"+k,JSON.stringify(v))}catch(e){}}};
let lib=store.get("lib",[]);          // [{id,title,artist,album,albumArtist,no,disc,dur,file,art}]
let loved=store.get("loved",{});
let prefs=store.get("prefs",{order:true,lock:false});
const mem=new Map();                   // id -> File/Blob for this session
const artUrl=new Map();                // art key -> object url
let queue=[],qi=-1,view="now",openAlbum=null;
const fmt=t=>!isFinite(t)||t<0?"0:00":`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=2600){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}
const saveLib=()=>store.set("lib",lib);

/* ---------- storage: origin private file system, falls back to session only ---------- */
let opfs=null;
async function getDir(name){if(!opfs){try{opfs=await navigator.storage.getDirectory()}catch(e){opfs=false}}if(!opfs)return null;return opfs.getDirectoryHandle(name,{create:true})}
async function putFile(dir,name,blob){try{const d=await getDir(dir);if(!d)return false;const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return true}catch(e){return false}}
async function getFile(dir,name){try{const d=await getDir(dir);if(!d)return null;return await (await d.getFileHandle(name)).getFile()}catch(e){return null}}
async function delFile(dir,name){try{const d=await getDir(dir);if(d)await d.removeEntry(name)}catch(e){}}

/* ---------- tag readers: FLAC, MP3 (ID3v2), M4A ---------- */
const td8=new TextDecoder("utf-8"),td1=new TextDecoder("latin1"),td16=new TextDecoder("utf-16le"),td16b=new TextDecoder("utf-16be");
async function readTags(file){
  const head=new DataView(await file.slice(0,Math.min(file.size,16*1024*1024)).arrayBuffer());
  const sig=String.fromCharCode(...new Uint8Array(head.buffer,0,Math.min(12,head.byteLength)));
  try{
    if(sig.startsWith("fLaC"))return flac(head);
    if(sig.startsWith("ID3"))return id3(head);
    if(sig.slice(4,8)==="ftyp")return await mp4(file);
  }catch(e){console.warn("tag read failed",file.name,e)}
  return {};
}
function flac(v){
  const t={};let p=4,last=false;
  while(!last&&p+4<=v.byteLength){
    const h=v.getUint8(p);last=!!(h&128);const type=h&127,len=(v.getUint8(p+1)<<16)|(v.getUint8(p+2)<<8)|v.getUint8(p+3);p+=4;
    if(p+len>v.byteLength)break;
    if(type===0){const sr=(v.getUint8(p+10)<<12)|(v.getUint8(p+11)<<4)|(v.getUint8(p+12)>>4);const hi=v.getUint8(p+13)&15;const tot=hi*2**32+v.getUint32(p+14);if(sr)t.dur=tot/sr}
    if(type===4){let q=p;const vl=v.getUint32(q,true);q+=4+vl;const n=v.getUint32(q,true);q+=4;
      for(let i=0;i<n;i++){const l=v.getUint32(q,true);q+=4;const s=td8.decode(new Uint8Array(v.buffer,q,l));q+=l;const k=s.indexOf("=");vc(t,s.slice(0,k).toUpperCase(),s.slice(k+1))}}
    if(type===6&&!t.pic){let q=p;const ptype=v.getUint32(q);q+=4;const ml=v.getUint32(q);q+=4;const mime=td1.decode(new Uint8Array(v.buffer,q,ml));q+=ml;const dl=v.getUint32(q);q+=4+dl+16;const n=v.getUint32(q);q+=4;
      const pic=new Blob([new Uint8Array(v.buffer,q,n)],{type:mime||"image/jpeg"});if(ptype===3||!t.pic)t.pic=pic}
    p+=len;
  }

}
function vc(t,k,val){({TITLE:()=>t.title=val,ARTIST:()=>t.artist=t.artist||val,ALBUMARTIST:()=>t.albumArtist=val,ALBUM:()=>t.album=val,TRACKNUMBER:()=>t.no=parseInt(val),DISCNUMBER:()=>t.disc=parseInt(val)}[k]||(()=>{}))()}
function id3(v){
  const t={},ver=v.getUint8(3);const ss=o=>(v.getUint8(o)<<21)|(v.getUint8(o+1)<<14)|(v.getUint8(o+2)<<7)|v.getUint8(o+3);
  const end=Math.min(10+ss(6),v.byteLength);let p=10;

  const txt=(o,n)=>{const e=v.getUint8(o),b=new Uint8Array(v.buffer,o+1,n-1);let s=e===0?td1.decode(b):e===3?td8.decode(b):e===2?td16b.decode(b):(b[0]===0xfe?td16b.decode(b.subarray(2)):td16.decode(b.subarray(2)));return s.replace(/\0+$/,"").split("\0")[0]};
  while(p+10<=end){

    const n=ver===4?ss(p+4):v.getUint32(p+4);const o=p+10;if(o+n>end||n<1)break;
    if(id==="TIT2")t.title=txt(o,n);else if(id==="TPE1")t.artist=txt(o,n);else if(id==="TPE2")t.albumArtist=txt(o,n);else if(id==="TALB")t.album=txt(o,n);
    else if(id==="TRCK")t.no=parseInt(txt(o,n));else if(id==="TPOS")t.disc=parseInt(txt(o,n));
    else if(id==="APIC"&&!t.pic){const e=v.getUint8(o);let q=o+1;let m="";while(q<o+n&&v.getUint8(q))m+=String.fromCharCode(v.getUint8(q++));q+=2;
      if(e===1||e===2){while(q+1<o+n&&(v.getUint8(q)||v.getUint8(q+1)))q+=2;q+=2}else{while(q<o+n&&v.getUint8(q))q++;q++}
      if(q<o+n)t.pic=new Blob([new Uint8Array(v.buffer,q,o+n-q)],{type:m.includes("/")?m:"image/"+(m||"jpeg").toLowerCase()})}

}
async function mp4(file){
  const t={};const rd=async(o,n)=>new DataView(await file.slice(o,o+n).arrayBuffer());
  let p=0,moov=null;
  while(p+8<=file.size){const h=await rd(p,16);let sz=h.getUint32(0);const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
    if(sz===1)sz=Number(h.getBigUint64(8));else if(sz===0)sz=file.size-p;if(sz<8)break;
    if(ty==="moov"){moov=await rd(p,sz);break}p+=sz}
  if(!moov)return t;
  const walk=(o,e,fn)=>{while(o+8<=e){const s=moov.getUint32(o),ty=String.fromCharCode(moov.getUint8(o+4),moov.getUint8(o+5),moov.getUint8(o+6),moov.getUint8(o+7));if(s<8)break;fn(ty,o+8,o+s);o+=s}};
  walk(8,moov.byteLength,(ty,o,e)=>{
    if(ty==="mvhd"){const vv=moov.getUint8(o);const ts=vv?moov.getUint32(o+20):moov.getUint32(o+12);const du=vv?Number(moov.getBigUint64(o+24)):moov.getUint32(o+16);if(ts)t.dur=du/ts}
    if(ty!=="udta")return;
    walk(o,e,(ty2,o2,e2)=>{if(ty2!=="meta")return;walk(o2+4,e2,(ty3,o3,e3)=>{if(ty3!=="ilst")return;walk(o3,e3,(k,o4,e4)=>{
      walk(o4,e4,(d,o5,e5)=>{if(d!=="data")return;const dt=moov.getUint32(o5)&0xffffff,b=new Uint8Array(moov.buffer,o5+8,e5-o5-8);
        const s=()=>td8.decode(b);
        if(k==="©nam")t.title=s();else if(k==="©ART")t.artist=s();else if(k==="aART")t.albumArtist=s();else if(k==="©alb")t.album=s();
        else if(k==="trkn"&&b.length>=4)t.no=(b[2]<<8)|b[3];else if(k==="disk"&&b.length>=4)t.disc=(b[2]<<8)|b[3];
        else if(k==="covr"&&!t.pic)t.pic=new Blob([b.slice()],{type:dt===14?"image/png":"image/jpeg"})})})})});
  });

}

/* ---------- import ---------- */
function fromName(file){
  const base=file.name.replace(/\.[^.]+$/,""),m=base.match(/^(\d{1,3})[\s._-]+(.+)$/);
  const parts=(file.webkitRelativePath||"").split("/");
  return {no:m?parseInt(m[1]):undefined,title:m?m[2]:base,album:parts.length>2?parts[parts.length-2]:undefined};
}
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
async function importFiles(list){
  const files=[...list].filter(f=>/\.(flac|mp3|m4a|aac|mp4|ogg|opus|wav)$/i.test(f.name)||f.type.startsWith("audio/"));
  if(!files.length){toast("no audio files in there");return}
  let saved=0,sessionOnly=0,i=0;
  for(const f of files){
    i++;$("winTitle").textContent=`importing ${i}/${files.length} — ${f.name}`;
    const id=hash(f.name+f.size+(f.webkitRelativePath||""));
    if(lib.some(x=>x.id===id))continue;
    const tg=await readTags(f),fn=fromName(f);
    const tr={id,title:tg.title||fn.title,artist:tg.artist||"unknown artist",album:tg.album||fn.album||"unknown album",albumArtist:tg.albumArtist||tg.artist||"unknown artist",no:tg.no||fn.no||0,disc:tg.disc||1,dur:tg.dur||0,file:f.name};
    const key=albumKey(tr);
    if(tg.pic&&!artUrl.has(key)){artUrl.set(key,URL.createObjectURL(tg.pic));await putFile("art",key,tg.pic);tr.art=key}
    else if(artUrl.has(key))tr.art=key;
    mem.set(id,f);
    if(await putFile("music",id,f)){tr.stored=true;saved++}else sessionOnly++;
    lib.push(tr);
  }
  lib.forEach(t=>{const k=albumKey(t);if(!t.art&&artUrl.has(k))t.art=k});
  saveLib();$("winTitle").textContent="okplayer";
  toast(sessionOnly?`added ${files.length} songs. couldn't save ${sessionOnly} to app storage, re-add those next time.`:`added ${files.length} songs to your library.`,4000);
  show("lib");
}
$("pickFiles").onchange=e=>{importFiles(e.target.files);e.target.value=""};
$("pickDir").onchange=e=>{importFiles(e.target.files);e.target.value=""};

/* ---------- library view ---------- */
function albumKey(t){return hash((t.albumArtist||t.artist)+"|"+t.album)}
function albums(){
  const m=new Map();lib.forEach(t=>{const k=albumKey(t);if(!m.has(k))m.set(k,{key:k,album:t.album,artist:t.albumArtist||t.artist,tracks:[]});m.get(k).tracks.push(t)});
  const a=[...m.values()];a.forEach(x=>x.tracks.sort((p,q)=>(p.disc-q.disc)||(p.no-q.no)||p.title.localeCompare(q.title)));
  return a.sort((p,q)=>p.artist.localeCompare(q.artist)||p.album.localeCompare(q.album));
}
async function art(key){if(!key)return null;if(artUrl.has(key))return artUrl.get(key);const f=await getFile("art",key);if(!f)return null;const u=URL.createObjectURL(f);artUrl.set(key,u);return u}
function genCover(el,name){const h=parseInt(hash(name),36)%360;el.classList.add("gen");el.style.background=`linear-gradient(135deg,hsl(${h} 55% 55%),hsl(${(h+50)%360} 60% 30%))`;el.textContent=(name||"?").trim()[0]?.toUpperCase()||"?"}
function renderLib(){
  const v=$("vLib");
  if(openAlbum){const a=albums().find(x=>x.key===openAlbum);if(a)return renderAlbum(a);openAlbum=null}
  const as=albums();
  v.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>library</h2><div class="sub">${lib.length} songs · ${as.length} albums</div></div>
    <div class="row"><button class="btn" id="addF">Add songs</button><button class="btn" id="addD">Add folder</button></div></div>
    ${lib.length?"":`<div class="hint">nothing here yet. add flac, mp3, m4a or ogg files from your phone. they get copied into the app so they're still here next time.</div>`}
    <div class="grid" id="albGrid"></div>`;
  $("addF").onclick=()=>$("pickFiles").click();$("addD").onclick=()=>$("pickDir").click();
  as.forEach(a=>{const b=document.createElement("button");b.className="alb";b.innerHTML=`<div class="cov"></div><b>${esc(a.album)}</b><small>${esc(a.artist)}</small>`;
    const c=b.querySelector(".cov");art(a.tracks.find(t=>t.art)?.art).then(u=>u?c.style.backgroundImage=`url("${u}")`:genCover(c,a.album));
    b.onclick=()=>{openAlbum=a.key;renderLib();$("pane").scrollTop=0};$("albGrid").appendChild(b)});
}
function renderAlbum(a){
  const v=$("vLib"),total=a.tracks.reduce((s,t)=>s+(t.dur||0),0);
  v.innerHTML=`<button class="back" id="back">‹ all albums</button>
    <div class="ahead"><div class="cov"></div><div><h2>${esc(a.album)}</h2><div class="sub">${esc(a.artist)} · ${a.tracks.length} songs${total?` · ${Math.round(total/60)} min`:""}</div>
    <div class="row" style="margin-top:8px"><button class="btn" id="playAll">▶ Play in order</button><button class="btn warn" id="rm">Remove</button></div></div></div>
    <div class="tracks" id="tl"></div>`;
  const c=v.querySelector(".cov");art(a.tracks.find(t=>t.art)?.art).then(u=>u?c.style.backgroundImage=`url("${u}")`:genCover(c,a.album));
  $("back").onclick=()=>{openAlbum=null;renderLib()};
  $("playAll").onclick=()=>{setMode(true);playList(a.tracks,0);show("now")};
  $("rm").onclick=async e=>{if(e.target.dataset.sure!=="1"){e.target.dataset.sure="1";e.target.textContent="Tap again to remove";return}
    for(const t of a.tracks){await delFile("music",t.id);mem.delete(t.id)}await delFile("art",a.key);lib=lib.filter(t=>albumKey(t)!==a.key);saveLib();openAlbum=null;renderLib();toast("album removed")};
  const cur=queue[qi]?.id;
  a.tracks.forEach((t,i)=>{const b=document.createElement("button");b.className="trk"+(t.id===cur?" cur":"");
    b.innerHTML=`<span class="n">${t.no||i+1}</span><span class="t">${esc(t.title)}</span><span class="d">${loved[t.id]?'<span class="lv">'+ICON_HEART+'</span>':""} ${t.dur?fmt(t.dur):""}</span>`;
    b.onclick=()=>{playList(a.tracks,i);show("now")};$("tl").appendChild(b)});
}

/* ---------- playback ---------- */
let actx,analyser,freq;
function setupAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaElementSource(audio);analyser=actx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;freq=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);analyser.connect(actx.destination)}catch(e){analyser=null}}
async function blobFor(t){if(mem.has(t.id))return mem.get(t.id);if(t.demo)return demoWav();const f=await getFile("music",t.id);if(f)mem.set(t.id,f);return f}
let curUrl=null,unlocked=false;
function playList(tracks,start){
  const base=[...tracks];
  if(!prefs.order){const first=base.splice(start,1)[0];for(let i=base.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[base[i],base[j]]=[base[j],base[i]]}base.unshift(first);start=0}
  queue=base;load(start,true);
}
async function load(i,autoplay){
  if(i<0||i>=queue.length)return;qi=i;const t=queue[i];unlocked=false;
  const b=await blobFor(t);
  if(!b){toast(`"${t.title}" isn't saved in the app. add the file again.`,4000);return}
  if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(b);audio.src=curUrl;
  store.set("last",{ids:queue.map(x=>x.id),qi:i});
  renderNow();
  if(autoplay){setupAudio();actx?.resume();audio.play().catch(()=>{})}
  const u=await art(t.art);$("label").style.backgroundImage=u?`url("${u}")`:"";
  if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:u?[{src:u,sizes:"512x512"}]:[]})}
}
function next(auto){if(prefs.lock&&!auto&&!unlocked){toast("no skipping. finish the song first.");return}if(qi+1<queue.length)load(qi+1,true);else if(auto){audio.pause();toast("end of the album")}}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return}if(prefs.lock){toast("no skipping, not even backwards");return}if(qi>0)load(qi-1,true)}
$("play").onclick=()=>{if(!queue.length){playDemo();return}setupAudio();actx?.resume();audio.paused?audio.play():audio.pause()};
$("next").onclick=()=>next(false);$("prev").onclick=prev;
audio.onended=()=>{unlocked=true;next(true)};
audio.onplay=audio.onpause=()=>{const on=!audio.paused;$("disc").classList.toggle("on",on);$("play").innerHTML=on?ICON_PAUSE:ICON_PLAY;$("play").setAttribute("aria-label",on?"Pause":"Play");$("pNowTxt").textContent=on?(queue[qi]?.title||"now playing"):"now playing";if("mediaSession" in navigator)navigator.mediaSession.playbackState=on?"playing":"paused"};
audio.onloadedmetadata=()=>{const t=queue[qi];if(t&&!t.dur&&isFinite(audio.duration)){t.dur=audio.duration;const l=lib.find(x=>x.id===t.id);if(l){l.dur=t.dur;saveLib()}}$("tLen").textContent=fmt(audio.duration)};
audio.ontimeupdate=()=>{if(seeking)return;const d=audio.duration||0,p=d?audio.currentTime/d*1000:0;$("seek").value=p;$("seek").style.setProperty("--p",p/10+"%");$("tNow").textContent=fmt(audio.currentTime);
  if("mediaSession" in navigator&&d&&isFinite(d))try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(audio.currentTime,d),playbackRate:1})}catch(e){}};
let seeking=false;
$("seek").oninput=e=>{seeking=true;const d=audio.duration||0,to=e.target.value/1000*d;
  if(prefs.lock&&to>audio.currentTime+1){e.target.value=audio.currentTime/d*1000;toast("no skipping ahead");seeking=false;return}
  e.target.style.setProperty("--p",e.target.value/10+"%");$("tNow").textContent=fmt(to)};
$("seek").onchange=e=>{const d=audio.duration||0,to=e.target.value/1000*d;if(!(prefs.lock&&to>audio.currentTime+1))audio.currentTime=to;seeking=false};
if("mediaSession" in navigator){const ms=navigator.mediaSession;
  ms.setActionHandler("play",()=>audio.play());ms.setActionHandler("pause",()=>audio.pause());
  ms.setActionHandler("nexttrack",()=>next(false));ms.setActionHandler("previoustrack",prev);
  try{ms.setActionHandler("seekto",d=>{if(!(prefs.lock&&d.seekTime>audio.currentTime))audio.currentTime=d.seekTime})}catch(e){}}

/* ---------- modes + reactions ---------- */
function setMode(order){prefs.order=order;store.set("prefs",prefs);renderModes()}
function renderModes(){$("mOrder").setAttribute("aria-pressed",prefs.order);$("mShuffle").setAttribute("aria-pressed",!prefs.order);$("mLock").setAttribute("aria-pressed",prefs.lock);
  $("note").textContent=prefs.lock?"no skipping on. the next song unlocks when this one ends.":""}
$("mOrder").onclick=()=>setMode(true);
$("mShuffle").onclick=()=>{if(prefs.lock){toast("turn off no skipping to shuffle");return}setMode(false);toast("shuffle on. the next album you play gets shuffled.")};
$("mLock").onclick=()=>{prefs.lock=!prefs.lock;if(prefs.lock)prefs.order=true;store.set("prefs",prefs);renderModes()};
function renderReact(){const r=$("react"),t=queue[qi];r.innerHTML="";if(!t)return;
  const b=document.createElement("button");b.className="chip";const on=!!loved[t.id];b.innerHTML=ICON_HEART+(on?" loved":" love this song");b.setAttribute("aria-pressed",on);
  b.onclick=()=>{if(loved[t.id])delete loved[t.id];else loved[t.id]=1;store.set("loved",loved);renderReact()};r.appendChild(b)}

/* ---------- views ---------- */
function renderNow(){
  const t=queue[qi],has=!!t;
  $("npTitle").textContent=has?t.title:"nothing playing";
  $("npArtist").textContent=has?`${t.artist} — ${t.album}`:lib.length?"pick an album in the library":"add music, or tap play for a demo";
  $("tLen").textContent=has&&t.dur?fmt(t.dur):"0:00";
  $("winTitle").textContent=has?`${t.title} — okplayer`:"okplayer";
  if(!has)$("label").style.backgroundImage="";
  renderReact();renderModes();
}
function show(v){view=v;$("vNow").hidden=v!=="now";$("vLib").hidden=v!=="lib";$("pNow").setAttribute("aria-selected",v==="now");$("pLib").setAttribute("aria-selected",v==="lib");if(v==="lib")renderLib();else renderNow();$("pane").scrollTop=0}
$("pNow").onclick=()=>show("now");$("pLib").onclick=()=>show("lib");$("orb").onclick=()=>show("lib");

/* ---------- demo track: a 40 second pad synthesized on the spot ---------- */
let demoBlob=null;
function demoWav(){if(demoBlob)return demoBlob;const sr=22050,n=sr*40,d=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));w(0,"RIFF");d.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*2,true);
  const chords=[[220,277.2,329.6,440],[196,246.9,293.7,392],[174.6,220,261.6,349.2],[196,246.9,293.7,370]];let seed=1;const rnd=()=>(seed=seed*16807%2147483647)/2147483647-.5;
  for(let i=0;i<n;i++){const t=i/sr,c=chords[Math.floor(t/5)%4],env=Math.min(1,t/2,(40-t)/3);let s=0;c.forEach((f,k)=>s+=Math.sin(2*Math.PI*f*t+Math.sin(t*.7+k))*.12);
    const step=Math.floor(t*4),ft=t*4-step,note=c[step%4]*2;s+=Math.sin(2*Math.PI*note*t)*Math.exp(-ft*5)*.18;s+=rnd()*.012;d.setInt16(44+i*2,Math.max(-1,Math.min(1,s*env))*32767,true)}
  return demoBlob=new Blob([d.buffer],{type:"audio/wav"})}
function playDemo(){queue=[{id:"demo",demo:true,title:"okplayer demo loop",artist:"okplayer",album:"test pressing",dur:40}];load(0,true)}

/* ---------- visualizer ---------- */
const cv=$("viz"),g=cv.getContext("2d");let W=0,H=0,ph=0;
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dp;cv.height=H*dp;g.setTransform(dp,0,0,dp,0,0)}
new ResizeObserver(size).observe($("vNow"));
const blobs=[["#5bcefa",.2,.2],["#f5a9b8",.8,.25],["#c9b8ff",.5,.6],["#5bcefa",.85,.8],["#f5a9b8",.12,.75]];
function draw(){
  if(!$("vNow").hidden&&W){
    const on=!audio.paused;let bass=0,bins=null;
    if(on&&analyser){analyser.getByteFrequencyData(freq);bins=freq;for(let i=0;i<8;i++)bass+=freq[i];bass/=8*255}
    ph+=on?.012:.002;
    g.fillStyle="#0d1520";g.fillRect(0,0,W,H);g.globalCompositeOperation="lighter";
    blobs.forEach(([c,x,y],i)=>{const px=W*(x+.08*Math.sin(ph+i*1.7)),py=H*(y+.06*Math.cos(ph*.8+i)),rad=Math.max(W,H)*(.3+bass*.25);
      const gr=g.createRadialGradient(px,py,0,px,py,rad);gr.addColorStop(0,c+(on?Math.round(24+bass*40).toString(16).padStart(2,"0"):"18"));gr.addColorStop(1,c+"00");g.fillStyle=gr;g.fillRect(0,0,W,H)});
    const n=40,bw=W/n,base=H;
    for(let i=0;i<n;i++){const v=bins?bins[Math.floor(i*bins.length*.7/n)]/255:.04+.02*Math.sin(i*.5+ph*4);const h=v*H*.2;
      const gr=g.createLinearGradient(0,base-h,0,base);gr.addColorStop(0,"rgba(245,169,184,.32)");gr.addColorStop(1,"rgba(91,206,250,.04)");g.fillStyle=gr;g.fillRect(i*bw+1,base-h,bw-2,h)}
    g.globalCompositeOperation="source-over";
  }
  if(!still)requestAnimationFrame(draw);
}
draw();if(still)setInterval(draw,1000);

/* ---------- boot ---------- */
setInterval(()=>{const d=new Date();$("clock").innerHTML=`${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}<br>${d.toLocaleDateString()}`},1000);
(async()=>{
  const last=store.get("last",null);
  if(last&&lib.length){const q=last.ids.map(id=>lib.find(t=>t.id===id)).filter(Boolean);if(q.length){queue=q;await load(Math.min(last.qi,q.length-1),false)}}
  renderNow();
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
